name: Scaling benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "memora/**"
      - "experiments/**"
      - "pyproject.toml"
      - ".github/workflows/scaling.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run scaling battery
        run: python -m experiments.benchmark --sizes 10 100 1000 5000 --chats 10 > scaling.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: memora-scaling-results
          path: scaling.json
